[project]
name = "vibecode"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Astu Masrundi", email = "astumasrundi12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "pymysql>=1.2.3",
]

[project.scripts]
vibecode = "vibecode:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

